name: Daily Ecosystem Snapshot

on:
  schedule:
    - cron: "37 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect ecosystem data
        run: python scripts/daily_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "areyoukaran"
          git config user.email "kashyapkaran483@gmail.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "data: add daily ecosystem snapshot"
          git push