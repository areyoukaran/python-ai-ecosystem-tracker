name: Daily Ecosystem Snapshot

on:
  schedule:
    - cron: "37 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # Setup
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # Select today's workload
      # --------------------------------

      - name: Select daily tasks
        id: selector
        run: python scripts/select_daily_tasks.py

      - name: Show daily plan
        run: |
          echo "Snapshot:  ${{ steps.selector.outputs.snapshot }}"
          echo "GitHub:    ${{ steps.selector.outputs.github }}"
          echo "PyPI:      ${{ steps.selector.outputs.pypi }}"
          echo "Analytics: ${{ steps.selector.outputs.analytics }}"
          echo "Report:    ${{ steps.selector.outputs.report }}"

      # --------------------------------
      # Daily snapshot
      # --------------------------------

      - name: Collect daily ecosystem snapshot
        if: steps.selector.outputs.snapshot == 'true'
        run: python scripts/daily_snapshot.py

      - name: Commit daily snapshot
        if: steps.selector.outputs.snapshot == 'true'
        run: |
          git config user.name "areyoukaran"
          git config user.email "kashyapkaran483@gmail.com"

          git add data/daily/
          git add data/latest/packages.json

          if git diff --cached --quiet; then
            echo "No daily snapshot changes"
          else
            git commit -m "data: add daily ecosystem snapshot"
          fi

      # --------------------------------
      # GitHub repository statistics
      # --------------------------------

      - name: Collect GitHub repository statistics
        if: steps.selector.outputs.github == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_tracker.py

      - name: Commit repository statistics
        if: steps.selector.outputs.github == 'true'
        run: |
          git add data/latest/github_repositories.json
          git add data/github/

          if git diff --cached --quiet; then
            echo "No repository statistics changed"
          else
            git commit -m "data: update GitHub repository statistics"
          fi

      # --------------------------------
      # PyPI release detection
      # --------------------------------

      - name: Check for PyPI releases
        if: steps.selector.outputs.pypi == 'true'
        run: python scripts/pypi_release_tracker.py

      - name: Commit PyPI release changes
        if: steps.selector.outputs.pypi == 'true'
        run: |
          git add -A data/releases/

          if git diff --cached --quiet; then
            echo "No new PyPI releases"
          else
            git commit -m "data: update tracked PyPI releases"
          fi

      # --------------------------------
      # Ecosystem analytics
      # --------------------------------

      - name: Generate ecosystem analytics
        if: steps.selector.outputs.analytics == 'true'
        run: python scripts/generate_analytics.py

      - name: Commit ecosystem analytics
        if: steps.selector.outputs.analytics == 'true'
        run: |
          git add analytics/

          if git diff --cached --quiet; then
            echo "No analytics changes"
          else
            git commit -m "analytics: update ecosystem metrics"
          fi

      # --------------------------------
      # Ecosystem report
      # --------------------------------

      - name: Generate ecosystem report
        if: steps.selector.outputs.report == 'true'
        run: python scripts/generate_report.py

      - name: Commit ecosystem report
        if: steps.selector.outputs.report == 'true'
        run: |
          git add reports/

          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "report: update ecosystem report"
          fi

      # --------------------------------
      # Push selected changes
      # --------------------------------

      - name: Push changes
        run: git push