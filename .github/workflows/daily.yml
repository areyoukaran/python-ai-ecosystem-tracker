name: Daily Ecosystem Snapshot

on:
  schedule:
    - cron: "37 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------
      # Guaranteed daily snapshot
      # --------------------------------

      - name: Collect daily ecosystem snapshot
        run: python scripts/daily_snapshot.py

      - name: Commit daily snapshot
        run: |
          git config user.name "areyoukaran"
          git config user.email "kashyapkaran483@gmail.com"

          git add data/daily/
          git add data/latest/packages.json

          if git diff --cached --quiet; then
            echo "No daily snapshot changes"
          else
            git commit -m "data: add daily ecosystem snapshot"
          fi

      # --------------------------------
      # GitHub repository statistics
      # --------------------------------

      - name: Collect GitHub repository statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_tracker.py

      - name: Commit repository statistics
        run: |
          git add data/latest/github_repositories.json
          git add data/github/

          if git diff --cached --quiet; then
            echo "No repository statistics changed"
          else
            git commit -m "data: update GitHub repository statistics"
          fi

      # --------------------------------
      # PyPI release detection
      # --------------------------------

      - name: Check for PyPI releases
        run: python scripts/pypi_release_tracker.py

      - name: Commit PyPI release changes
        run: |
          git add -A data/releases/

          if git diff --cached --quiet; then
            echo "No new PyPI releases"
          else
            git commit -m "data: update tracked PyPI releases"
          fi

      # --------------------------------
      # Ecosystem analytics
      # --------------------------------

      - name: Generate ecosystem analytics
        run: python scripts/generate_analytics.py

      - name: Commit ecosystem analytics
        run: |
          git add analytics/

          if git diff --cached --quiet; then
            echo "No analytics changes"
          else
            git commit -m "analytics: update ecosystem metrics"
          fi

      # --------------------------------
      # Push everything
      # --------------------------------

      - name: Push changes
        run: git push